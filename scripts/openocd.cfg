# Run from the repository root: openocd -f scripts/openocd.cfg
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/stm32h7x.cfg]
adapter speed 1800
bindto 127.0.0.1
gdb_port 3333
tcl_port 6666
init
# RTT is started by rtt_terminal.py after firmware initialization.
